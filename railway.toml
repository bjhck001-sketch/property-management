[build]
context = "./backend"
dockerfile = "Dockerfile"

[[services]]
  name = "api"
  build = { context = "./backend", dockerfile = "Dockerfile" }
  env = [
    "DATABASE_URL=sqlite+aiosqlite:///./test.db",
    "JWT_SECRET=your-secret-key-here",
    "CORS_ORIGINS=*"
  ]
  workdir = "/app"
  git = { repo = "https://github.com/bjhck001-sketch/property-management.git", branch = "main" }
