version: '3.8'
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./test.db
      - JWT_SECRET=your-secret-key-here
      - CORS_ORIGINS=*
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
