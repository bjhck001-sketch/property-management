name: property_management_mobile
description: 物业管理 APP - 业主端和工作人员端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  dio: ^5.3.0
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.0
  flutter_local_notifications: ^16.0.0
  intl: ^0.18.0
  go_router: ^12.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.0
  url_launcher: ^6.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    
  fonts:
    - family: CustomIcon
      fonts:
        - asset: assets/icons/custom_icon.ttf
